name: CI

# Every push and pull request runs the same two checks a developer runs
# locally: the backend suite (Maven, Dev Services PostgreSQL) and the frontend
# tests, lint, format check and build. Keeping them as separate jobs means a
# frontend failure never hides a backend one, and vice versa.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Dev Services starts the test PostgreSQL in a container; the runner has
      # Docker, so no service definition is needed here.
      - run: mvn -B -DskipFrontend test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
