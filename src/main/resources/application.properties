quarkus.application.name=babymonitor
quarkus.http.port=8080

# Motion's live stream listens on 8081 and its web control on 8091 (from the
# camera rows), which is also Quarkus's default test port. Let the test HTTP
# server take a free port instead, so the suite runs even while Motion is up.
quarkus.http.test-port=0

# ---------------------------------------------------------------------------
# Datasource -- local development PostgreSQL.
# Credentials come from the environment when present, falling back to the
# throwaway local dev account (db "bob", user "bob", password "bob").
#
# The fixed URL is scoped to %dev and %prod. %test deliberately leaves it
# unset, so Dev Services starts a disposable container for the suite instead
# (see "Test database" below) and no test ever touches the developer's own
# database.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:bob}
quarkus.datasource.password=${DB_PASSWORD:bob}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bob}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bob}

# ---------------------------------------------------------------------------
# Flyway
#
# The schema is owned by the migrations in src/main/resources/db/migration and
# applied automatically at startup; db/init.sql is gone. baseline-on-migrate
# lets a database that predates Flyway -- one built by the retired db/init.sql,
# so already matching V1 -- be marked as baselined at V1 and brought forward by
# the later migrations, instead of being dropped and recreated. A fresh database
# runs every migration from empty.
#
# To start a database over from scratch instead, drop it first:
#   PGPASSWORD=bob dropdb -h 127.0.0.1 -U bob bob && PGPASSWORD=bob createdb -h 127.0.0.1 -U bob bob
# ---------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.schemas=babymonitor
quarkus.flyway.table=flyway_schema_history

# ---------------------------------------------------------------------------
# Hibernate / Panache
#
# Flyway creates the schema, so Hibernate must not try to manage it
# (generation=none). Entities are mapped into the "babymonitor" schema; `update`
# is intentionally NOT used because it would make Hibernate the owner of the
# schema behind Flyway's back.
# ---------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=babymonitor
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.sql=true

# ---------------------------------------------------------------------------
# Test database
#
# The backend tests are hermetic. %test has no JDBC URL (it is scoped to %dev
# and %prod above), so Dev Services starts a disposable PostgreSQL container,
# Flyway migrates and seeds it from the real migrations, and it is destroyed
# when the run ends. The suite therefore never reads or writes the developer's
# database, and an edited camera row or a leftover alert can no longer break it.
# Docker (or Podman) must be available for `mvn test`.
#
# The image is pinned so a run is reproducible rather than tracking Dev
# Services' default tag.
# ---------------------------------------------------------------------------
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine

# ---------------------------------------------------------------------------
# SPA
#
# The Vite bundle is built into META-INF/resources (index.html + assets/).
# Unknown non-API paths fall back to index.html so client-side routes such as
# /settings survive a browser refresh. Quarkus 3.40 has no built-in
# "spa-fallback-index" option, so this is done by SpaFallbackFilter (a Vert.x
# filter registered through the Filters bean).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Auth
#
# Lifetime of an issued bearer token. Tokens live in memory only (see
# SessionStore); a restart logs everyone out.
# ---------------------------------------------------------------------------
babymonitor.auth.session-ttl=PT12H

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
#
# Schema:     GET /q/openapi (YAML) or /q/openapi?format=json
# Swagger UI: GET /q/swagger-ui
#
# always-include keeps Swagger UI available outside dev mode too.
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=BabyMonitor API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Live-stream settings, notifications and auth for BabyMonitor
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# ---------------------------------------------------------------------------
# Motion (the app-managed per-camera processes)
#
# BabyMonitor owns one `motion` process per camera: it writes
# /home/bob/motion/motion.config.<n> from the camera's rows in
# babymonitor.cameras and starts `motion -n -c <that file>`. There is no master
# switch -- a camera may be stopped, but the app can always start or stop it.
# Startup is cold: with reset-on-start on, any process left over from a previous
# run is killed and every camera is marked not running, so the user starts a
# camera from its own page.
#
# check-interval is how often MotionSupervisor checks that a camera whose
# persisted state says "running" still has a live process, restarting it (and
# recording a notification) when it does not. Tests never spawn a real `motion`:
# they repoint `binary` and `base-dir` at a stub and a scratch directory.
# ---------------------------------------------------------------------------
babymonitor.motion.binary=/usr/bin/motion
babymonitor.motion.base-dir=/home/bob/motion
babymonitor.motion.template-name=motion.template
babymonitor.motion.notify-script-name=motion-notify.sh
babymonitor.motion.reset-on-start=true
babymonitor.motion.check-interval=15s
babymonitor.motion.webhook-url=http://localhost:8080/api/webhooks/videoNotification

# ---------------------------------------------------------------------------
# Audio capture and cry detection
#
# AudioService starts the capture binary on a camera's ALSA device, slices its
# raw s16le output into analysis windows, drops the quiet ones and scores the
# rest with YAMNet (in-JVM, through DJL's TFLite engine). A run of confident cry
# windows becomes an Audio notification, so it reaches the feed, the event
# stream and the chime exactly as a device webhook alert does.
#
# `binary` may be sox, ffmpeg or arecord -- the flag shape is chosen from the
# name. sample-rate is 16 kHz because YAMNet needs it. frame-samples and
# hop-samples are the ~0.975 s window and ~0.48 s step at that rate, and when
# classifier-enabled is true frame-samples must stay at 15600 because that is
# the length YAMNet was built for. Windows below silence-rms are dropped.
#
# `device` is the ALSA device a camera captures from when its own
# camera_audio.device is unset; ALSA `default` resolves to the box's default
# input. reset-on-start kills leftover captures and clears every camera's
# desired audio state at boot, so audio comes up only from a camera's Start (or
# its Audio button). check-interval is how often AudioSupervisor checks that a
# camera that wants audio still has a live capture, restarting it (and recording
# a System notification) when it does not.
#
# The classes worth waking anyone for are not configured here: they live in
# babymonitor.audio_alert_classes and are edited from the Audio Notification
# Config page. A fresh database starts with classes 0-61 on (Speech & Human
# Sounds plus the human-sound start of Singing & Music Genres) and every other
# class off. min-confidence is the score a
# class needs; windows-to-alert is how many consecutive windows must reach it
# before an alert fires, which keeps one stray window from chiming;
# cooldown-seconds is how long a camera stays quiet after an alert. Tests
# repoint `binary` at a stub and swap the model for StubClassifier, so no test
# opens a microphone or loads the model.
# ---------------------------------------------------------------------------
#babymonitor.audio.binary=sox
#babymonitor.audio.device=default
#babymonitor.audio.base-dir=/home/bob/babymonitor/audio
#babymonitor.audio.reset-on-start=true
#babymonitor.audio.check-interval=15s
#babymonitor.audio.sample-rate=16000
#babymonitor.audio.frame-samples=15600
#babymonitor.audio.hop-samples=7680
#babymonitor.audio.silence-rms=0.005
#babymonitor.audio.classifier-enabled=true
#babymonitor.audio.model-resource=/yamnet/yamnet.tflite
#babymonitor.audio.labels-resource=/yamnet/yamnet_class_map.csv
#babymonitor.audio.min-confidence=0.35
#babymonitor.audio.windows-to-alert=2
#babymonitor.audio.cooldown-seconds=60

# ---------------------------------------------------------------------------
# Environment alerts
#
# EnvironmentSupervisor compares the newest nursery reading with the high/low
# bounds stored on the Environment page (humidity %, temperature °F, brightness
# lux) every check-interval and records an Environment notification when a value
# is outside them. The bounds themselves are edited from the page, not here.
# ---------------------------------------------------------------------------
babymonitor.environment.check-interval=60s

# ---------------------------------------------------------------------------
# Camera light sensor
#
# CameraLightSensor probes a UVC camera at a fixed manual exposure to derive a
# luma band (dark .. very bright). It reads one frame from the camera's existing
# MJPEG stream, so the camera must be running; it switches auto_exposure to
# manual, sets exposure_time_absolute (100 µs units), samples, and restores
# auto-exposure. The sensor is calibrated per camera from the Environment page.
# ---------------------------------------------------------------------------
babymonitor.light.v4l2-ctl=/usr/bin/v4l2-ctl
babymonitor.light.ffmpeg=/usr/bin/ffmpeg
babymonitor.light.timeout-seconds=10
babymonitor.light.check-interval=60s

# ---------------------------------------------------------------------------
# Scheduler
#
# MotionSupervisor ticks on babymonitor.motion.check-interval, AudioSupervisor on
# babymonitor.audio.check-interval, EnvironmentSupervisor on
# babymonitor.environment.check-interval and CameraLightSupervisor on
# babymonitor.light.check-interval. Tests drive their checkOnce() methods
# directly rather than racing a timer, so the scheduler is off under %test.
# ---------------------------------------------------------------------------
%test.quarkus.scheduler.enabled=false

# ---------------------------------------------------------------------------
# Webhooks
#
# The camera / motion detector POSTs to
#   /api/webhooks/audioNotification
#   /api/webhooks/videoNotification
#
# These are intentionally outside the bearer-token gate (the sender is a
# device, not a logged-in browser). The secret is left unset to accept any
# caller (dev default); set BABYMONITOR_WEBHOOKS_SECRET to require a matching
# X-Webhook-Secret header. It is read as an Optional, so do not set it to an
# empty string -- an empty value is treated as missing anyway.
# ---------------------------------------------------------------------------
#babymonitor.webhooks.secret=change-me
